name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The site may only publish numbers that SQL and pandas agree on, so the
      # pipeline runs in CI too. run_all.py exits non-zero on any mismatch, and
      # build_brief_facts.py exits non-zero if a figure no longer matches the
      # exact words of the source row it cites. Either one fails the deploy.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline and check the numbers ledger
        run: python pipeline/run_all.py

      - name: Build the approved media
        run: |
          pip install pillow
          python pipeline/build_media.py

      - name: Install site dependencies
        run: npm ci
        working-directory: web

      - name: Build the static site
        run: npm run build
        working-directory: web
        env:
          DESK_READY_BASE_PATH: /desk-ready

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
